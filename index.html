<style>

:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}

<title>Pull-Up Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* One-screen session app: progress strip, figure stage, exercise card, thumb-zone actions. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#16202B; --muted:#5B6776; --line:#D5DBE3;
  --accent:#2F55D4; --accent-ink:#FFFFFF; --band:#9A5A00; --stage:#E2E7EE; --skin:#C3CCD7; --eq:#7D8794; --m1:#D3312B; --m2:#F09A8C; --mm0:#CDD4DD;
  --display:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#18202A; --ink:#E7ECF2; --muted:#9AA6B5; --line:#2A3542;
  --accent:#86A2FF; --accent-ink:#0F141B; --band:#FFB547; --stage:#141B24; --skin:#6B7888; --eq:#5D6876; --m1:#FF5A4E; --m2:#A14B42; --mm0:#2C3642; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#18202A; --ink:#E7ECF2; --muted:#9AA6B5; --line:#2A3542;
  --accent:#86A2FF; --accent-ink:#0F141B; --band:#FFB547; --stage:#141B24; --skin:#6B7888; --eq:#5D6876; --m1:#FF5A4E; --m2:#A14B42; --mm0:#2C3642; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:20px;height:20px}
.progress{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.plabel{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.segs{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.seg{height:6px;border-radius:3px;background:var(--line)}
.seg.done{background:var(--accent);opacity:.45}
.seg.now{background:var(--accent)}
.stage{flex:1 1 auto;min-height:240px;background:var(--stage);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;position:relative;padding:34px 12px 10px;box-sizing:border-box}
.figwrap{flex:1;min-height:0;position:relative;display:grid;place-items:center}
.c3d{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
.c3d:active{cursor:grabbing}
.nofig{color:var(--muted);font-size:14px;text-align:center;max-width:30ch;margin:0}
.hint{flex:none;min-height:36px;padding:0 12px;border-radius:10px;border:0;background:var(--surface);color:var(--muted);font-family:var(--body);font-size:12px;font-weight:600;cursor:pointer}
.stagefoot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.legend{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;line-height:1.3;min-width:0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend .k1{background:var(--m1)} .legend .k2{background:var(--m2)}
.legend.col{gap:8px;font-size:15px}
.sheetsec{margin-top:6px;font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tag{position:absolute;top:12px;left:12px;font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{display:flex;flex-direction:column;gap:8px}
.name{margin:0;font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-0.02em;text-wrap:balance}
.rx{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-0.02em;color:var(--accent);font-variant-numeric:tabular-nums}
.namerow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.namerow .name{min-width:0}
.tipsbtn{flex:none;width:44px;height:44px;margin:-6px -8px 0 0;border:0;border-radius:50%;background:transparent;color:var(--accent);display:grid;place-items:center;cursor:pointer}
.tipsbtn svg{width:26px;height:26px}
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;box-sizing:border-box;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-top:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  max-height:80%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet .iconbtn{background:var(--bg)}
.sheethead h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;letter-spacing:-0.02em}
.tips{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.45}
.tips li::marker{color:var(--accent)}
.sets{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.unit{font-size:15px;font-weight:600;color:var(--muted)}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--display);font-weight:700;font-size:18px;cursor:pointer;display:grid;place-items:center}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.btn{min-height:56px;border-radius:16px;border:0;font-family:var(--display);font-weight:700;font-size:19px;cursor:pointer;padding:0 18px}
.primary{background:var(--accent);color:var(--accent-ink)}
.timerbtn{width:56px;height:56px;border-radius:16px;border:0;background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.timerbtn svg{width:26px;height:26px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rest{background:var(--surface);border-radius:20px;padding:16px;display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:28px;color:var(--ink);font-variant-numeric:tabular-nums}
.restinfo{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.restlabel{font-family:var(--body);font-weight:700;font-size:15px;color:var(--muted)}
.restbtns{display:flex;gap:8px;flex-wrap:wrap}
.small{min-height:44px;padding:0 16px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:16px;cursor:pointer;border:2px solid var(--accent);background:transparent;color:var(--accent)}
.small.fill{background:var(--accent);color:var(--accent-ink)}
/* After the first set the exercise card grows (big reps or rest ring) and the demo takes what's left. */
.zone{display:contents}
.focus .stage{min-height:0;padding:8px}
.focus .stagefoot,.focus .tag{display:none}
.focus .name{font-size:28px}
.focus .zone{display:flex;flex-direction:column;gap:14px}
.fcard{background:var(--surface);border-radius:20px;padding:16px 18px;gap:10px}
.fcard:not(.resting) .rx{padding:8px 0;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.fcard:not(.resting) .big{font-size:72px;line-height:1}
.fcard:not(.resting) .unit{font-size:17px}
.ccard{background:var(--surface);border-radius:20px;padding:16px 18px}
.setchip{align-self:flex-start;font-family:var(--display);font-weight:700;font-size:15px;color:var(--accent);background:var(--bg);border-radius:999px;padding:5px 12px;font-variant-numeric:tabular-nums}
.setchip span{color:var(--muted)}
.fcard .setchip{align-self:center;font-size:18px;padding:6px 16px;margin-bottom:8px}
.focus .actions .btn{min-height:clamp(88px,16vh,128px);font-size:26px}
.focus .timerbtn{width:72px;height:auto}
.focus .timerbtn svg{width:32px;height:32px}
.fcard .rest{flex-direction:column;justify-content:center;gap:14px;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 0 0}
.fcard .ring{width:clamp(120px,26vh,210px);height:clamp(120px,26vh,210px);align-self:center}
.fcard .ring .t{font-size:48px}
.fcard .restinfo{flex:none;align-items:center;text-align:center;gap:12px}
.fcard .restlabel{font-size:17px}
.fcard .small{min-height:56px;padding:0 26px;font-size:18px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.plabel.left{text-align:left}
.totpill{font-size:13px;font-weight:600;color:var(--accent);background:var(--surface);border-radius:999px;padding:5px 12px;white-space:nowrap}
.finhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.finbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-bottom:8%}
.hero{margin:0;font-family:var(--display);font-weight:700;font-size:48px;line-height:.95;letter-spacing:-0.03em;text-wrap:balance}
.hl{color:var(--accent)}
.hello{margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-0.02em}
.bigweek{background:var(--surface);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:4px}
.bwhead{display:flex;align-items:baseline;gap:8px}
.bwnum{font-family:var(--display);font-weight:700;font-size:76px;line-height:.85;color:var(--accent);font-variant-numeric:tabular-nums}
.bwof{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;letter-spacing:-0.02em}
.bwlab{font-family:var(--body);font-weight:600;font-size:16px;color:var(--muted)}
.bwrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bwtext{min-width:0}
.bwdots{display:flex;gap:8px;flex:none}
.bwd{width:44px;height:44px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted);box-sizing:border-box}
.bwd.on{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.bwd svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bwsub{margin-top:10px;font-size:14px;color:var(--muted)}
.decor{flex:1;min-height:90px;position:relative}
.decor .figwrap{position:absolute;inset:0}
.decor .c3d{pointer-events:none;cursor:default}
.lede{margin:0;color:var(--muted);font-size:17px;line-height:1.45;max-width:40ch}
.weekcard{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:16px;padding:14px 16px}
.weekdots{display:flex;gap:6px;flex:none}
.wd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box}
.wd.on{background:var(--accent);border-color:var(--accent)}
.wklab{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1;letter-spacing:-0.01em}
.wksub{font-size:14px;color:var(--muted);margin-top:2px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.meta span{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:999px;padding:5px 12px}
.btn.big{min-height:64px;font-size:22px}
.grow{flex:1}
.fine{margin:-4px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.hellorow{display:flex;align-items:center;gap:14px}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--accent)}
.avpick{display:block;cursor:pointer;flex:none;border-radius:50%}
.avpick:focus-within{outline:3px solid var(--accent);outline-offset:3px}
.avph{display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:28px}
.avatar.big.avph{font-size:52px}
.avatar.big{width:128px;height:128px;border-width:4px;box-shadow:0 0 0 3px var(--accent)}
.champ{position:relative;width:128px;height:128px;margin-top:8px}
.champtick{position:absolute;right:-6px;bottom:-4px;width:46px;height:46px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);display:grid;place-items:center}
.champtick svg{width:62%;height:62%}
.champtick .badge-tick{stroke:var(--accent-ink)}
.badge-tick{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:tick .6s .15s ease-out forwards}
@keyframes tick{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.badge-tick{animation:none;stroke-dashoffset:0}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.eq{stroke:var(--muted);stroke-width:5;stroke-linecap:round;fill:none;opacity:.7}
.eqf{fill:var(--muted);opacity:.7;stroke:none}
.db{fill:var(--ink);stroke:none}
.band{stroke:var(--band);stroke-width:4;fill:none;stroke-linecap:round;opacity:.8}
</style>

</head>
<body>
<div class="app" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- 3D figure: control points per keyframe, limbs solved with 2-bone IK ----------
const View3D = (() => {
  if (!window.THREE) return null;
  const T = THREE, V = (x, y, z) => new T.Vector3(x, y, z);
  const L_UA = 0.29, L_FA = 0.27, L_TH = 0.43, L_SH = 0.42;
  const nrm = a => { const l = Math.hypot(...a) || 1; return a.map(v => v / l); };

  // ---- exercise definitions (metres, y up). lat = body's left→right axis, u = pelvis→neck ----
  const BAR_Y = 2.2;
  const hangBase = { lat:[1,0,0], toe:nrm([0,-0.7,1]), sh:-0.05 };
  const E = {};

  E.chin = { cam:{az:72, el:8, dist:3.5, ty:1.55}, bar:true, band:true,
    keys:[0,1.3,1.7,3.4],
    poses:[
      {...hangBase, P:[0,1.19,-0.02], N:[0,1.69,-0.02], LH:[-0.15,BAR_Y,0], RH:[0.15,BAR_Y,0], LF:[-0.06,0.52,-0.22], RF:[0.06,0.5,-0.26], poles:{LE:[0,-0.3,1], RE:[0,-0.3,1], LK:[0,0,1], RK:[0,0,1]}},
      {...hangBase, P:[0,1.66,-0.2], N:[0,2.15,-0.12], LH:[-0.15,BAR_Y,0], RH:[0.15,BAR_Y,0], LF:[-0.06,1.02,-0.42], RF:[0.06,1.0,-0.46], poles:{LE:[-0.15,-1,0.8], RE:[0.15,-1,0.8], LK:[0,0,1], RK:[0,0,1]}},
    ], seq:[0,1,1,0], muscles:{lats:'m1', ua:'m1', fa:'m2'}};

  const wideTop = {...hangBase, P:[0,1.64,-0.12], N:[0,2.14,-0.08], LH:[-0.32,BAR_Y,0], RH:[0.32,BAR_Y,0], LF:[-0.1,0.95,-0.2], RF:[0.1,0.95,-0.2], poles:{LE:[-1,-0.4,-0.3], RE:[1,-0.4,-0.3], LK:[0,0,1], RK:[0,0,1]}};
  const wideBot = {...hangBase, P:[0,1.2,0], N:[0,1.7,0], LH:[-0.32,BAR_Y,0], RH:[0.32,BAR_Y,0], LF:[-0.09,0.38,-0.06], RF:[0.09,0.38,-0.06], poles:{LE:[-1,-0.2,-0.3], RE:[1,-0.2,-0.3], LK:[0,0,1], RK:[0,0,1]}};
  E.neg = { cam:{az:215, el:10, dist:3.6, ty:1.4}, bar:true, chair:true,
    keys:[0,0.7,4.9,5.6,6.6], poses:[wideTop, wideBot], seq:[0,0,1,1,0], muscles:{lats:'m1', ua:'m2', fa:'m2'}};

  E.pullup = { cam:{az:32, el:8, dist:3.6, ty:1.5}, bar:true, keys:[0,1.2,1.7,3.2,3.7], poses:[wideTop, wideBot], seq:[1,0,0,1,1], muscles:{lats:'m1', ua:'m2', fa:'m2'}};
  const midGrip = {LH:[-0.25,BAR_Y,0], RH:[0.25,BAR_Y,0]};
  const passive = {...hangBase, ...midGrip, P:[0,1.13,0], N:[0,1.63,0], sh:0.03, LF:[-0.09,0.32,-0.04], RF:[0.09,0.32,-0.04], poles:{LE:[-1,0,-0.2], RE:[1,0,-0.2], LK:[0,0,1], RK:[0,0,1]}};
  const active = {...passive, P:[0,1.22,0], N:[0,1.72,0], sh:-0.06, LF:[-0.09,0.41,-0.04], RF:[0.09,0.41,-0.04]};
  E.scap = { cam:{az:205, el:12, dist:3.2, ty:1.55}, bar:true, keys:[0,0.9,1.5,2.6], poses:[passive, active], seq:[0,1,1,0], muscles:{lats:'m1'}};

  const hangA = {...active, sh:-0.04, P:[-0.015,1.2,0.03]}, hangB = {...active, sh:-0.04, P:[0.015,1.2,-0.03]};
  E.hang = { cam:{az:200, el:10, dist:3.4, ty:1.45}, bar:true, keys:[0,2,4], poses:[hangA, hangB], seq:[0,1,0], muscles:{fa:'m1', lats:'m2'}};

  const rowBot = { lat:[0,0,1], toe:[-1,0,0], sh:-0.05, P:[0.25,0.92,0], N:[-0.26,0.98,0],
    LH:[-0.46,0.52,-0.2], RH:[-0.24,0.4,0.22], LF:[0.02,0.08,-0.2], RF:[0.36,0.08,0.24],
    poles:{LE:[0.3,0,-1], RE:[0.4,0,0.6], LK:[-1,0,0], RK:[-1,0,0]}, db:['R'], dbAxis:[1,0,0]};
  const rowTop = {...rowBot, RH:[0.02,0.82,0.22], poles:{...rowBot.poles, RE:[0.5,1,0.3]}};
  E.row = { cam:{az:28, el:18, dist:2.9, ty:0.65, tx:0}, bench:true, keys:[0,0.9,1.4,2.6], poses:[rowBot,rowTop], seq:[0,1,1,0], muscles:{lats:'m1', uaR:'m2', deltR:'m2'}};

  const pushPose = th => { const r = th*Math.PI/180, c = Math.cos(r), s = Math.sin(r), Fx = 0.81, Fy = 0.1;
    return { lat:[0,0,1], toe:nrm([-0.6,-1,0]), sh:-0.04, P:[Fx-0.85*c, Fy+0.85*s-0.06, 0], N:[Fx-1.36*c, Fy+1.36*s-0.06, 0],
      LH:[0,0.78,-0.24], RH:[0,0.78,0.24], LF:[Fx,Fy,-0.11], RF:[Fx,Fy,0.11],
      poles:{LE:[1,0.6,-1], RE:[1,0.6,1], LK:[1,1,0], RK:[1,1,0]} }; };
  E.push = { cam:{az:22, el:14, dist:3.0, ty:0.75, tx:0.25}, table:true, keys:[0,1.1,1.4,2.5], poses:[pushPose(67), pushPose(47)], seq:[0,1,1,0], muscles:{pecs:'m1', ua:'m2', delt:'m2', abs:'m2'}};

  const pressBot = { lat:[0,0,-1], toe:[1,0,0], sh:-0.04, P:[0.36,0.12,0], N:[-0.14,0.12,0],

const KEY='pullup-coach-v1';
const AKEY='pullup-coach-avatar';
let AVATAR=null; try{ AVATAR=localStorage.getItem(AKEY); }catch(e){}
function avatarHTML(cls){
  const inner = AVATAR ? `<img class="${cls}" src="${AVATAR}" alt="Sindhu">` : `<span class="${cls} avph" aria-hidden="true">S</span>`;
  return `<label class="avpick" aria-label="Change photo">${inner}<input type="file" accept="image/*" class="avinput" hidden></label>`;
}
function bindAvatar(){ document.querySelectorAll('.avinput').forEach(inp=>inp.onchange=()=>{
  const f=inp.files&&inp.files[0]; if(!f) return; const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{ const n=240, c=document.createElement('canvas'); c.width=c.height=n; const k=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,n,n); URL.revokeObjectURL(url);
    AVATAR=c.toDataURL('image/jpeg',0.85); try{ localStorage.setItem(AKEY,AVATAR); }catch(e){} render(); };
  img.src=url; }); }
const HKEY='pullup-coach-history', FINISH_MS=3*60*1000;
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => ymd(new Date());
function fresh(){ return {date:today(), step:0, done:{}, finished:false, view:'welcome'}; }
let S = fresh();
try{ const raw = JSON.parse(localStorage.getItem(KEY));
  if(raw && raw.date===today()){
    if(raw.finished && raw.finishedAt && Date.now()-raw.finishedAt < FINISH_MS) S = raw;
    else if(!raw.finished && raw.view==='workout') S = raw;
  } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let history = [];
try{ history = JSON.parse(localStorage.getItem(HKEY)) || []; }catch(e){}
function logSession(){ if(!history.includes(today())) history.push(today()); try{ localStorage.setItem(HKEY, JSON.stringify(history)); }catch(e){} }
function weekCount(){ const d=new Date(); const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)); const start=ymd(mon);
  return history.filter(x=>x>=start && x<=today()).length; }
let homeTimer = null;
function finishSession(){ S.finished=true; S.finishedAt=Date.now(); rest=null; clearInterval(tick); logSession(); save(); render(); confetti(); scheduleHome(); }
function scheduleHome(){ clearTimeout(homeTimer); if(!S.finished) return; const left = FINISH_MS - (Date.now()-(S.finishedAt||0));
  homeTimer = setTimeout(goHome, Math.max(0,left)); }
function goHome(){ clearTimeout(homeTimer); S=fresh(); save(); render(); }
function startWorkout(){ unlockAudio(); keepAwake(); S=fresh(); S.view='workout'; save(); render(); }

let rest = null; // {end,total}
let tipsOpen = false;
let tick = null, audio = null, wake = null;

const fmt = s => { s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const ICON = {
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'
};

function keepAwake(){ try{ if(!wake && navigator.wakeLock) navigator.wakeLock.request('screen').then(w=>{wake=w; w.addEventListener('release',()=>wake=null);}).catch(()=>{}); }catch(e){} }
function beep(){
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(t=>{ const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001,audio.currentTime+t); g.gain.exponentialRampToValueAtTime(0.3,audio.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+t+0.18);
      o.start(audio.currentTime+t); o.stop(audio.currentTime+t+0.2); });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
function unlockAudio(){ try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); audio.resume && audio.resume(); }catch(e){} }

function startRest(sec){
  unlockAudio(); keepAwake();
  rest = {end:Date.now()+sec*1000, total:sec};
  clearInterval(tick); tick = setInterval(updateRest, 250);
  render();
}
function stopRest(){ rest=null; clearInterval(tick); render(); }
function updateRest(){
  if(!rest) return;
  const left = (rest.end-Date.now())/1000;
  if(left<=0){ beep(); stopRest(); return; }
  const t=document.getElementById('rt'), c=document.getElementById('rc');
  if(t) t.textContent = fmt(left);
  if(c) c.style.strokeDashoffset = String(289*(1-left/rest.total));
}

function go(i){ tipsOpen=false; S.step=Math.max(0,Math.min(STEPS.length-1,i)); S.finished=false; rest=null; clearInterval(tick); save(); render(); }

function render(){
  const app=document.getElementById('app');
  app.classList.remove('focus');
  if(S.finished){
    const n = history.length, wk = Math.min(weekCount(),3);
    app.innerHTML = `<div class="screen finish">
      <div class="finhead"><div class="plabel left">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}</div>
        <button class="iconbtn" id="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg></button></div>
      <div class="finbody">
      <div class="champ">${avatarHTML('avatar big')}<span class="champtick" aria-hidden="true"><svg viewBox="0 0 120 120"><path d="M34 62l17 17 36-40" class="badge-tick"/></svg></span></div>
      <h1 class="hero">Session<br>done!</h1>
      <p class="lede">One step closer to your first pull-up.</p>
      <div class="weekcard"><div class="weekdots">${[0,1,2].map(i=>`<span class="wd ${i<wk?'on':''}"></span>`).join('')}</div>
        <div class="wklab">${wk} of 3 this week</div></div>
      </div>
</div>`;
    document.getElementById('home').onclick=goHome; bindAvatar();
    return;
  }
  if(S.view!=='workout'){
    const n = history.length, wk = Math.min(weekCount(),3), h = new Date().getHours();
    const hello = h<12?'Good morning':h<18?'Good afternoon':'Good evening';
    app.innerHTML = `<div class="screen welcome">
      <div class="finhead"><div class="plabel left">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}</div>${n?`<span class="totpill">${n} session${n>1?'s':''} total</span>`:''}</div>
      <div class="hellorow">${avatarHTML('avatar')}<h1 class="hello">${hello},<br><span class="hl">Sindhu</span></h1></div>
      <section class="bigweek" aria-label="Sessions this week">
        <div class="bwrow"><div class="bwtext"><div class="bwhead"><span class="bwnum">${wk}</span><span class="bwof">of 3</span></div>
        <div class="bwlab">${wk>=3?'Full week done!':'sessions this week'}</div></div>
        <div class="bwdots">${[0,1,2].map(i=>`<span class="bwd ${i<wk?'on':''}" aria-label="Session ${i+1}${i<wk?' done':''}">${i<wk?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':i+1}</span>`).join('')}</div></div>
      </section>
      <div class="decor" aria-hidden="true"><div class="figwrap" id="figwrap"></div></div>
      <button class="btn primary big" id="start">Start workout</button></div>`;
    if(View3D) View3D.mount(document.getElementById('figwrap'), 'pullup');
    document.getElementById('start').onclick=startWorkout; bindAvatar();
    return;
  }
  const st=STEPS[S.step], done=S.done[st.id]||0, complete=done>=st.sets, last=S.step===STEPS.length-1;
  const segs=STEPS.map((x,i)=>`<div class="seg ${i<S.step?'done':''} ${i===S.step?'now':''}"></div>`).join('');
  const focus = done>0;
  app.classList.toggle('focus', focus);
  const primaryLabel = complete ? (last?'Finish session':'Next exercise') : 'Done';
  // Set 1 shows a compact exercise card; from set 2 the full card takes over: name, set chip and reps, or the rest timer
  const setChip = !rest && (focus || st.sets>1) ? `<div class="setchip">${complete?(st.sets===1?'Done':'All sets done'):`Set ${done+1}<span>/${st.sets}</span>`}</div>` : '';
  const timerLabel = st.timerLabel || `Rest ${fmt(st.rest)}`;
  const restTimer = rest ? `<div class="rest" role="timer" aria-live="off">
      <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--line)" stroke-width="7"/>
      <circle id="rc" cx="50" cy="50" r="46" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0"/></svg>
      <div class="t" id="rt">${fmt((rest.end-Date.now())/1000)}</div></div>
      <div class="restinfo">${focus&&!complete&&st.id!=='warm'?`<div class="setchip">Set ${done+1}<span>/${st.sets}</span> next</div>`:`<div class="restlabel">${st.id==='warm'?'Warm-up':'Resting'}</div>`}
      <div class="restbtns"><button class="small" id="plus">+15 s</button><button class="small fill" id="skip">${st.id==='warm'?'Stop':'Skip'}</button></div></div></div>` : '';
  const restBlock = rest ? (focus ? '' : restTimer) :
    `<div class="actions"><button class="btn primary" id="primary"${!complete&&st.sets>1?` aria-label="Done, set ${done+1} of ${st.sets}"`:''}>${primaryLabel}</button>${st.noTimer?'':`<button class="timerbtn" id="timer" aria-label="Start rest timer, ${timerLabel}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 1.5M10 2.5h4M12 2.5V6"/></svg></button>`}</div>`;

  app.innerHTML = `
    <div class="top">
      <button class="iconbtn" id="prev" aria-label="Previous exercise" ${S.step===0?'disabled':''}>${ICON.prev}</button>
      <div class="progress"><div class="plabel">Exercise ${S.step+1} of ${STEPS.length}</div><div class="segs">${segs}</div></div>
      <button class="iconbtn" id="next" aria-label="Next exercise" ${last?'disabled':''}>${ICON.next}</button>
    </div>
    <div class="stage"><div class="tag">${st.group}</div>
      <div class="figwrap" id="figwrap">${View3D?'':'<p class="nofig">The 3D demo needs a connection to load. Check your internet and reopen the page.</p>'}</div>
      <div class="stagefoot"><div class="legend"><span><i class="k1"></i>${st.mpl}</span><span><i class="k2"></i>${st.msl}</span></div></div></div>
    <div class="zone">
    <div class="card${focus?' fcard':' ccard'}${focus&&rest?' resting':''}">
      <div class="namerow"><h1 class="name">${st.name}</h1><button class="tipsbtn" id="tipsbtn" aria-label="Form tips" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button></div>
      ${focus?'':setChip}<div class="rx">${focus?setChip:''}<span class="big">${st.big}</span><span class="unit">${st.unit}</span></div>
      ${focus?restTimer:''}
    </div>
    ${restBlock}</div>
    <div class="scrim" id="scrim" ${tipsOpen?'':'hidden'}>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle">
        <div class="sheethead"><h2 id="sheettitle">${st.name}</h2><button class="iconbtn" id="closetips" aria-label="Close tips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <ul class="tips">${st.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
      </div>
    </div>`;
  if(View3D){ View3D.mount(document.getElementById('figwrap'), st.anim); }
  document.getElementById('tipsbtn').onclick=()=>{ tipsOpen=true; document.getElementById('scrim').hidden=false; document.getElementById('closetips').focus(); };
  const closeTips=()=>{ tipsOpen=false; document.getElementById('scrim').hidden=true; document.getElementById('tipsbtn').focus(); };
  document.getElementById('closetips').onclick=closeTips;
  document.getElementById('scrim').onclick=e=>{ if(e.target.id==='scrim') closeTips(); };

  document.getElementById('prev').onclick=()=>go(S.step-1);
  document.getElementById('next').onclick=()=>go(S.step+1);
  if(rest){
    document.getElementById('plus').onclick=()=>{ rest.end+=15000; rest.total+=15; updateRest(); };
    document.getElementById('skip').onclick=stopRest;
    updateRest();
  } else {
    if(!st.noTimer) document.getElementById('timer').onclick=()=>startRest(st.rest);
    document.getElementById('primary').onclick=()=>{
      keepAwake();
      if(complete){ if(last) finishSession(); else go(S.step+1); return; }
      S.done[st.id]=done+1; save();
      if(done+1<st.sets){ startRest(st.rest); return; }
      if(last){ finishSession(); return; }
      go(S.step+1); if(!st.noTimer) startRest(st.rest);
    };
  }
}
function nextDay(){
  const d=new Date().getDay(); // 0 Sun
  const map={0:'Monday',1:'Wednesday',2:'Wednesday',3:'Friday',4:'Friday',5:'Monday',6:'Monday'};
  return map[d];
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && tipsOpen){ tipsOpen=false; const sc=document.getElementById('scrim'); if(sc) sc.hidden=true; } });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(rest) updateRest(); if(wake===null && rest) keepAwake(); }});
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>View3D&&View3D.rebuild()); new MutationObserver(()=>View3D&&View3D.rebuild()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']}); }catch(e){}
function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  const dpr=Math.min(window.devicePixelRatio||1,2), W=innerWidth, H=innerHeight; c.width=W*dpr; c.height=H*dpr; const x=c.getContext('2d'); x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement), cols=['--accent','--m1','--m2'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-0.5)*60,y:H*0.35,vx:(Math.random()-0.5)*9,vy:-Math.random()*11-4,r:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.3,w:6+Math.random()*6,h:3+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(now){ const e=(now-t0)/1000; x.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy+=0.28; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.max(0,1-e/3.2); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
    if(e<3.3) requestAnimationFrame(f); else c.remove(); })(t0);
}
render(); scheduleHome();
</script>
